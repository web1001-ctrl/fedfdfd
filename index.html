<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
  >

  <title>Last Finger</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      user-select: none;
      -webkit-user-select: none;

      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      touch-action: none;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 50% 35%,
          #202c5c 0%,
          #0b1024 42%,
          #02030a 100%
        );
    }


    /* =========================
       MAIN
    ========================= */

    #game {
      position: relative;

      width: 100%;
      height: 100dvh;

      overflow: hidden;

      touch-action: none;
    }


    /* =========================
       TITLE
    ========================= */

    #title {
      position: absolute;

      top: 22px;
      left: 0;

      width: 100%;

      text-align: center;

      font-size: 27px;

      font-weight: 900;

      letter-spacing: 5px;

      z-index: 20;

      pointer-events: none;

      text-shadow:
        0 0 20px rgba(255,255,255,.35);
    }


    #status {
      position: absolute;

      top: 65px;
      left: 0;

      width: 100%;

      text-align: center;

      color: #9faad0;

      font-size: 13px;

      z-index: 20;

      pointer-events: none;
    }


    /* =========================
       PLAYER COUNT
    ========================= */

    #counter {
      position: absolute;

      top: 95px;
      right: 18px;

      padding: 7px 12px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid rgba(255,255,255,.1);

      color: #aeb8dc;

      font-size: 12px;

      font-weight: bold;

      z-index: 30;

      pointer-events: none;
    }


    /* =========================
       ARENA
    ========================= */

    #arena {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      touch-action: none;
    }


    /* =========================
       FINGER
    ========================= */

    .finger {
      position: absolute;

      width: 78px;
      height: 78px;

      border-radius: 50%;

      transform:
        translate(-50%, -50%)
        scale(1);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 25px;

      font-weight: 900;

      color: white;

      background:
        radial-gradient(
          circle at 30% 25%,
          #ffffff 0%,
          #a5baff 12%,
          #536eff 42%,
          #202b9a 100%
        );

      border:
        3px solid rgba(255,255,255,.95);

      box-shadow:
        0 0 15px #5577ff,
        0 0 40px rgba(70,100,255,.65),
        inset 0 0 20px rgba(255,255,255,.25);

      pointer-events: none;

      z-index: 10;

      transition:
        opacity .3s ease,
        filter .3s ease;
    }


    /* Finger glow ring */

    .finger::after {
      content: "";

      position: absolute;

      inset: -9px;

      border-radius: 50%;

      border:
        2px solid rgba(100,140,255,.2);

      animation:
        ring 1.5s infinite;
    }


    @keyframes ring {

      0% {
        transform: scale(.8);

        opacity: .8;
      }

      100% {
        transform: scale(1.35);

        opacity: 0;
      }

    }


    /* =========================
       RANDOM ACTIVE FINGER
    ========================= */

    .finger.active {

      animation:
        randomScale .16s infinite alternate;

      box-shadow:
        0 0 20px #ffffff,
        0 0 50px #6587ff,
        0 0 100px rgba(50,90,255,.9);
    }


    @keyframes randomScale {

      from {

        transform:
          translate(-50%, -50%)
          scale(1.15);

      }

      to {

        transform:
          translate(-50%, -50%)
          scale(1.55);

      }

    }


    /* =========================
       LOSER
    ========================= */

    .finger.loser {

      background:
        radial-gradient(
          circle at 30% 25%,
          #ffffff 0%,
          #ffaaaa 12%,
          #ff2d2d 43%,
          #720000 100%
        );

      border-color: white;

      z-index: 100;

      box-shadow:
        0 0 25px #ff0000,
        0 0 60px #ff2020,
        0 0 120px rgba(255,0,0,.9);

      animation:
        loserShake .1s infinite alternate;
    }


    @keyframes loserShake {

      from {

        transform:
          translate(-53%, -50%)
          scale(1.55)
          rotate(-6deg);

      }

      to {

        transform:
          translate(-47%, -50%)
          scale(1.85)
          rotate(6deg);

      }

    }


    /* Other players disappear */

    .finger.disappear {

      opacity: 0;

      filter: blur(12px);

      transform:
        translate(-50%, -50%)
        scale(.1);
    }


    /* =========================
       START BUTTON
    ========================= */

    #start {

      position: absolute;

      left: 50%;
      bottom: 55px;

      transform:
        translateX(-50%);

      width: 220px;
      height: 65px;

      border: none;

      border-radius: 20px;

      color: white;

      font-size: 20px;

      font-weight: 900;

      letter-spacing: 3px;

      background:
        linear-gradient(
          135deg,
          #5577ff,
          #783dff
        );

      box-shadow:
        0 10px 35px rgba(70,80,255,.55),
        inset 0 1px 1px rgba(255,255,255,.4);

      z-index: 100;

      transition:
        opacity .3s,
        transform .15s;
    }


    #start:active {

      transform:
        translateX(-50%)
        scale(.92);
    }


    #start.hidden {

      opacity: 0;

      pointer-events: none;
    }


    /* =========================
       RESULT
    ========================= */

    #result {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(0,0,0,.75);

      backdrop-filter:
        blur(10px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .4s;

      z-index: 200;
    }


    #result.show {

      opacity: 1;

      pointer-events: auto;
    }


    .result-box {

      width: 85%;

      max-width: 390px;

      padding: 35px 25px;

      border-radius: 28px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          #1b2242,
          #080b18
        );

      border:
        1px solid rgba(255,255,255,.12);

      box-shadow:
        0 30px 100px rgba(0,0,0,.8);
    }


    .result-small {

      color: #a8b1d1;

      font-size: 13px;

      letter-spacing: 3px;

      margin-bottom: 12px;
    }


    #loserText {

      font-size: 38px;

      font-weight: 1000;

      color: #ff3939;

      margin-bottom: 25px;

      text-shadow:
        0 0 25px rgba(255,0,0,.75);
    }


    #again {

      width: 100%;

      height: 58px;

      border: none;

      border-radius: 16px;

      color: white;

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 2px;

      background:
        linear-gradient(
          135deg,
          #5577ff,
          #783dff
        );
    }


  </style>

</head>


<body>


<div id="game">


  <div id="title">
    LAST FINGER
  </div>


  <div id="status">
    START ni bosing
  </div>


  <div id="counter">
    0 / 8
  </div>


  <div id="arena"></div>


  <button id="start">
    START
  </button>


  <!-- RESULT -->

  <div id="result">

    <div class="result-box">

      <div class="result-small">
        THE LOSER IS
      </div>

      <div id="loserText">
        PLAYER 1
      </div>

      <button id="again">
        PLAY AGAIN
      </button>

    </div>

  </div>


</div>


<script>


  /* =========================
       ELEMENTS
  ========================= */

  const arena =
    document.getElementById("arena");

  const startButton =
    document.getElementById("start");

  const status =
    document.getElementById("status");

  const counter =
    document.getElementById("counter");

  const result =
    document.getElementById("result");

  const loserText =
    document.getElementById("loserText");

  const again =
    document.getElementById("again");


  /* =========================
       SETTINGS
  ========================= */

  const MAX_PLAYERS = 8;


  /*
    Barmoqlar shu yerda saqlanadi
  */

  let players = new Map();


  let playerNumber = 0;


  /*
    O'yin boshlangandan keyin
    yangi barmoq qabul qilinmaydi
  */

  let started = false;


  let randomTimer = null;


  let selectedPlayer = null;


  let audioContext = null;


  /* =========================
       AUDIO
  ========================= */

  function initAudio() {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  }


  function playSound(
    frequency,
    duration,
    volume,
    type = "sine"
  ) {

    if (!audioContext) return;


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type = type;


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime +
      duration
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }


  /* =========================
       FINGER ADDED SOUND
  ========================= */

  function fingerSound() {

    playSound(
      550,
      .08,
      .04,
      "sine"
    );

  }


  /* =========================
       RANDOM SOUND
  ========================= */

  function randomSound() {

    playSound(
      300 +
      Math.random() * 450,

      .055,

      .035,

      "square"
    );

  }


  /* =========================
       LOSE SOUND
  ========================= */

  function loserSound() {

    /*
      Juda balandroq va kuchliroq
    */

    playSound(
      800,
      .15,
      .16,
      "sawtooth"
    );


    setTimeout(
      () => {

        playSound(
          550,
          .18,
          .18,
          "sawtooth"
        );

      },
      130
    );


    setTimeout(
      () => {

        playSound(
          250,
          .3,
          .20,
          "sawtooth"
        );

      },
      280
    );


    setTimeout(
      () => {

        playSound(
          100,
          .55,
          .22,
          "square"
        );

      },
      430
    );

  }


  /* =========================
       COUNTER
  ========================= */

  function updateCounter() {

    counter.textContent =
      players.size +
      " / " +
      MAX_PLAYERS;

  }


  /* =========================
       START
  ========================= */

  startButton.addEventListener(
    "click",
    () => {


      /*
        Audio browser tomonidan
        ruxsat olishi uchun
      */

      initAudio();


      /*
        START faqat bir marta
      */

      if (started) return;


      /*
        Agar hali hech kim
        barmog'ini qo'ymagan bo'lsa
      */

      if (players.size === 0) {

        status.textContent =
          "Avval barmoqlarni qo'ying";

        playSound(
          180,
          .12,
          .05
        );

        return;

      }


      /*
        START bosildi
      */

      started = true;


      /*
        START yo'qoladi
      */

      startButton.classList.add(
        "hidden"
      );


      status.textContent =
        "Barmoqlarni qo'ying...";


      /*
        MUHIM:
        Bu yerda o'yin darhol
        random qilinmaydi.

        START bosilgandan keyin
        odamlar barmoqlarini
        qo'yishi uchun kutamiz.

        Oxirgi yangi barmoq
        qo'yilishi bilan
        avtomatik startRandom()
        ishlaydi.
      */

      checkAutoStart();

    }
  );


  /* =========================
       ADD FINGER
  ========================= */

  arena.addEventListener(
    "pointerdown",
    (event) => {


      event.preventDefault();


      /*
        START hali bosilmagan bo'lsa,
        barmoq qabul qilinmaydi.

        Chunki sen xohlaganing:
        avval START.
      */

      if (!started) {

        return;

      }


      /*
        Random boshlangan bo'lsa
        yangi barmoq qabul qilinmaydi.
      */

      if (
        randomTimer !== null
      ) {

        return;

      }


      /*
        Maximum 8
      */

      if (
        players.size >=
        MAX_PLAYERS
      ) {

        return;

      }


      /*
        Bir pointer qayta
        qo'shilmasin
      */

      if (
        players.has(
          event.pointerId
        )
      ) {

        return;

      }


      /*
        Yangi doira
      */

      const finger =
        document.createElement(
          "div"
        );


      finger.className =
        "finger";


      const number =
        ++playerNumber;


      finger.textContent =
        number;


      finger.style.left =
        event.clientX + "px";


      finger.style.top =
        event.clientY + "px";


      arena.appendChild(
        finger
      );


      players.set(
        event.pointerId,
        {
          id:
            event.pointerId,

          number:
            number,

          element:
            finger
        }
      );


      updateCounter();


      fingerSound();


      /*
        Qancha odam bo'lsa
        shuni ko'rsatamiz
      */

      status.textContent =
        players.size +
        " players";


      /*
        MUHIM:
        Yangi barmoq qo'yilishi
        bilan tekshiramiz.

        Agar 1.5 sekund ichida
        yangi barmoq kelmasa,
        random avtomatik boshlanadi.
      */

      startAutoTimer();

    },
    {
      passive: false
    }
  );


  /* =========================
       MOVE FINGER
  ========================= */

  arena.addEventListener(
    "pointermove",
    (event) => {


      if (!started) return;


      if (
        randomTimer !== null
      ) {

        return;

      }


      const player =
        players.get(
          event.pointerId
        );


      if (!player) return;


      player.element.style.left =
        event.clientX + "px";


      player.element.style.top =
        event.clientY + "px";

    }
  );


  /* =========================
       DO NOT REMOVE FINGERS
       BEFORE RANDOM
  ========================= */

  arena.addEventListener(
    "pointerup",
    (event) => {

      /*
        START bosilgandan keyin
        qo'yilgan barmoq ekranda
        qoladi.

        Shuning uchun bu yerda
        o'chirmaymiz.
      */

    }
  );


  arena.addEventListener(
    "pointercancel",
    (event) => {

      /*
        O'chirmaymiz.
      */

    }
  );


  /* =========================
       AUTO START TIMER
  ========================= */

  let autoStartTimer = null;


  function startAutoTimer() {


    /*
      Old timer bo'lsa
      tozalaymiz.
    */

    if (
      autoStartTimer
    ) {

      clearTimeout(
        autoStartTimer
      );

    }


    /*
      Oxirgi barmoq qo'yilgandan
      1.5 sekund o'tgach
      random boshlanadi.
    */

    autoStartTimer =
      setTimeout(
        () => {

          checkAutoStart();

        },
        1500
      );

  }


  function checkAutoStart() {


    if (!started) return;


    if (
      players.size === 0
    ) {

      return;

    }


    /*
      Random boshlanadi
    */

    status.textContent =
      "RANDOM...";


    startRandom();

  }


  /* =========================
       RANDOM GAME
  ========================= */

  function startRandom() {


    /*
      Endi random timer
      ishlayapti deb belgilaymiz.
    */

    randomTimer = true;


    const list =
      Array.from(
        players.values()
      );


    let round = 0;


    let previous = null;


    function nextRound() {


      /*
        Barcha active
        animatsiyani o'chiramiz.
      */

      list.forEach(
        player => {

          player.element
            .classList
            .remove(
              "active"
            );

        }
      );


      /*
        Random player
      */

      let randomPlayer;


      do {

        randomPlayer =
          list[
            Math.floor(
              Math.random() *
              list.length
            )
          ];

      }
      while (
        list.length > 1 &&
        randomPlayer === previous
      );


      previous =
        randomPlayer;


      selectedPlayer =
        randomPlayer;


      /*
        Active
      */

      randomPlayer.element
        .classList
        .add(
          "active"
        );


      /*
        RANDOM OVOZI
      */

      randomSound();


      round++;


      /*
        Asta-sekin tezlashadi
      */

      const speed =
        Math.max(
          45,
          240 -
          round * 5
        );


      /*
        Taxminan 40 aylanish
      */

      if (
        round >= 40
      ) {


        setTimeout(
          () => {

            finishGame();

          },
          550
        );


        return;

      }


      randomTimer =
        setTimeout(
          nextRound,
          speed
        );

    }


    nextRound();

  }


  /* =========================
       FINISH
  ========================= */

  function finishGame() {


    /*
      Random timer
    */

    clearTimeout(
      randomTimer
    );


    randomTimer = null;


    /*
      Tanlangan odam
    */

    const loser =
      selectedPlayer;


    if (!loser) return;


    /*
      Active animatsiyani
      olib tashlaymiz.
    */

    loser.element
      .classList
      .remove(
        "active"
      );


    /*
      Qolganlar yo'qoladi
    */

    players.forEach(
      player => {

        if (
          player !== loser
        ) {

          player.element
            .classList
            .add(
              "disappear"
            );

        }

      }
    );


    /*
      LOSER
    */

    loser.element
      .classList
      .add(
        "loser"
      );


    status.textContent =
      "PLAYER " +
      loser.number +
      " LOST!";


    /*
      BALAND OVOZ
    */

    loserSound();


    /*
      Natijani ko'rsatish
    */

    setTimeout(
      () => {

        loserText.textContent =
          "PLAYER " +
          loser.number;

        result.classList
          .add(
            "show"
          );

      },
      1000
    );

  }


  /* =========================
       PLAY AGAIN
  ========================= */

  again.addEventListener(
    "click",
    () => {


      /*
        Timerlarni tozalash
      */

      clearTimeout(
        randomTimer
      );

      clearTimeout(
        autoStartTimer
      );


      /*
        Barcha fingerlarni
        o'chirish
      */

      players.forEach(
        player => {

          player.element.remove();

        }
      );


      players.clear();


      /*
        Reset
      */

      playerNumber = 0;

      selectedPlayer = null;

      randomTimer = null;

      started = false;


      /*
        Result yopiladi
      */

      result.classList
        .remove(
          "show"
        );


      /*
        START qaytadi
      */

      startButton.classList
        .remove(
          "hidden"
        );


      status.textContent =
        "START ni bosing";


      updateCounter();

    }
  );


  /* =========================
       PREVENT CONTEXT MENU
  ========================= */

  document.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

    }
  );


  updateCounter();

</script>

</body>

</html>
